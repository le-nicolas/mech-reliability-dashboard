name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build executable
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Create release zip
        shell: powershell
        run: |
          Compress-Archive -Path dist/ReliabilityDashboard/* -DestinationPath ReliabilityDashboard-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReliabilityDashboard-windows
          path: ReliabilityDashboard-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ReliabilityDashboard-windows.zip

