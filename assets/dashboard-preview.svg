<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Reliability Dashboard Preview</title>
  <desc id="desc">Mock preview of desktop reliability analytics application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f7ff"/>
      <stop offset="100%" stop-color="#d6e6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="64" rx="10" fill="#0b3a66"/>
  <text x="68" y="71" fill="#ffffff" font-size="28" font-family="Segoe UI, Arial">Reliability Dashboard - Rotating Equipment</text>
  <rect x="40" y="115" width="1120" height="110" rx="10" fill="#ffffff" stroke="#c9d8ea"/>

  <rect x="60" y="138" width="190" height="70" rx="8" fill="#ecf5ff" stroke="#b5cee9"/>
  <text x="75" y="165" font-size="16" font-family="Segoe UI, Arial" fill="#2a4e73">Total Failures</text>
  <text x="75" y="194" font-size="28" font-family="Segoe UI, Arial" fill="#0c416f">40</text>

  <rect x="270" y="138" width="190" height="70" rx="8" fill="#ecf5ff" stroke="#b5cee9"/>
  <text x="285" y="165" font-size="16" font-family="Segoe UI, Arial" fill="#2a4e73">Downtime (hrs)</text>
  <text x="285" y="194" font-size="28" font-family="Segoe UI, Arial" fill="#0c416f">159.0</text>

  <rect x="480" y="138" width="190" height="70" rx="8" fill="#ecf5ff" stroke="#b5cee9"/>
  <text x="495" y="165" font-size="16" font-family="Segoe UI, Arial" fill="#2a4e73">MTTR (hrs)</text>
  <text x="495" y="194" font-size="28" font-family="Segoe UI, Arial" fill="#0c416f">2.96</text>

  <rect x="690" y="138" width="190" height="70" rx="8" fill="#ecf5ff" stroke="#b5cee9"/>
  <text x="705" y="165" font-size="16" font-family="Segoe UI, Arial" fill="#2a4e73">MTBF (hrs)</text>
  <text x="705" y="194" font-size="28" font-family="Segoe UI, Arial" fill="#0c416f">423.0</text>

  <rect x="900" y="138" width="240" height="70" rx="8" fill="#ecf5ff" stroke="#b5cee9"/>
