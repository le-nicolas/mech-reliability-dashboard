  <text x="635" y="352" font-size="12" font-family="Segoe UI, Arial" fill="#305273">Overheat</text>
  <text x="635" y="379" font-size="12" font-family="Segoe UI, Arial" fill="#305273">Seal Leak</text>
  <text x="635" y="406" font-size="12" font-family="Segoe UI, Arial" fill="#305273">Imbalance</text>

  <rect x="610" y="455" width="550" height="200" rx="10" fill="#ffffff" stroke="#c9d8ea"/>
  <text x="628" y="483" font-size="18" font-family="Segoe UI, Arial" fill="#1f3f62">Downtime by Asset (Top 10)</text>
  <rect x="628" y="497" width="514" height="140" rx="6" fill="#f8fbff" stroke="#dce8f5"/>
